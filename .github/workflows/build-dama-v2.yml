name: Build Dama v2 Core

on:
  pull_request:
    branches: [main]
    paths:
      - "dama-v2/**"
      - ".github/workflows/build-dama-v2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Unit tests
        run: gradle -p dama-v2 testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p dama-v2 assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dama-v2-core-debug
          path: dama-v2/app/build/outputs/apk/debug/app-debug.apk
