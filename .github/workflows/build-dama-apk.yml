name: Build Dama APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle -p dama assembleDebug --stacktrace
      - name: Rename APK
        run: cp dama/app/build/outputs/apk/debug/app-debug.apk dama-v0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dama-apk-v0.2
          path: dama-v0.2.apk
