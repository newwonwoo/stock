name: Build Dama v2 Core

on:
  pull_request:
    branches: [main]
    paths:
      - "dama-v2/**"
      - ".github/workflows/build-dama-v2.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install host test dependencies
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Controlled network integration tests
        working-directory: dama-v2/test-harness
        run: python -m unittest -v test_fixture_server.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Kotlin unit tests
        run: gradle -p dama-v2 testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle -p dama-v2 lintDebug --stacktrace

      - name: Build debug APK
        run: gradle -p dama-v2 assembleDebug --stacktrace

      - name: Compile emulator test APK
        run: gradle -p dama-v2 assembleDebugAndroidTest --stacktrace

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: dama-v2-verified-debug
          path: dama-v2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dama-v2-test-reports
          if-no-files-found: ignore
          path: |
            dama-v2/app/build/reports/tests/testDebugUnitTest
            dama-v2/app/build/reports/lint-results-debug.html

  target-sites:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install target-site probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "yt-dlp[default,curl-cffi]" playwright
          python -m yt_dlp --list-impersonate-targets
          python -m playwright install --with-deps chromium

      - name: Probe sites with yt-dlp and save playable samples
        shell: bash
        run: |
          set +e
          mkdir -p dama-v2/build/target-sites
          DAMA_TARGET_REPORT=dama-v2/build/target-sites/yt-dlp-report.json \
            python dama-v2/test-harness/probe_target_sites.py \
            | tee dama-v2/build/target-sites/yt-dlp-console.log
          echo "${PIPESTATUS[0]}" > dama-v2/build/target-sites/yt-dlp-status.txt
          exit 0

      - name: Probe Pornhub with bounded desktop retries
        shell: bash
        run: |
          set +e
          DAMA_PORNHUB_REPORT=dama-v2/build/target-sites/pornhub-report.json \
            python dama-v2/test-harness/probe_pornhub.py \
            | tee dama-v2/build/target-sites/pornhub-console.log
          echo "${PIPESTATUS[0]}" > dama-v2/build/target-sites/pornhub-status.txt
          exit 0

      - name: Probe sites with Chromium network sniffing
        shell: bash
        run: |
          set +e
          DAMA_BROWSER_REPORT=dama-v2/build/target-sites/browser-report.json \
            python dama-v2/test-harness/browser_sniff_targets.py \
            | tee dama-v2/build/target-sites/browser-console.log
          echo "${PIPESTATUS[0]}" > dama-v2/build/target-sites/browser-status.txt
          exit 0

      - name: Probe NjavTV browser-session HLS
        shell: bash
        run: |
          set +e
          DAMA_NJAVTV_REPORT=dama-v2/build/target-sites/njavtv-hls-report.json \
            python dama-v2/test-harness/probe_njavtv_hls.py \
            | tee dama-v2/build/target-sites/njavtv-hls-console.log
          echo "${PIPESTATUS[0]}" > dama-v2/build/target-sites/njavtv-hls-status.txt
          exit 0

      - name: Probe PikPak public share API
        shell: bash
        run: |
          set +e
          DAMA_PIKPAK_REPORT=dama-v2/build/target-sites/pikpak-share-report.json \
            python dama-v2/test-harness/probe_pikpak_share.py \
            | tee dama-v2/build/target-sites/pikpak-share-console.log
          echo "${PIPESTATUS[0]}" > dama-v2/build/target-sites/pikpak-share-status.txt
          exit 0

      - name: Evaluate target-site MVP gate
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path("dama-v2/build/target-sites")
          pornhub = json.loads((root / "pornhub-report.json").read_text())
          njavtv = json.loads((root / "njavtv-hls-report.json").read_text())
          pikpak = json.loads((root / "pikpak-share-report.json").read_text())

          checks = {
              "pornhub": bool(pornhub.get("passed")),
              "njavtv": bool(njavtv.get("passed")),
              "pikpak": bool(pikpak.get("passed")),
          }
          report = {"all_passed": all(checks.values()), "checks": checks}
          (root / "mvp-gate.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          sys.exit(0 if report["all_passed"] else 1)
          PY

      - name: Upload target-site reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dama-v2-target-site-report
          if-no-files-found: error
          path: dama-v2/build/target-sites

  emulator:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Start deterministic fixture server
        run: |
          nohup python dama-v2/test-harness/fixture_server.py \
            --host 0.0.0.0 --port 8765 \
            > /tmp/dama-fixture.log 2>&1 &
          echo $! > /tmp/dama-fixture.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dama-fixture.log
          exit 1

      - name: Emulator UI, browser capture, yt-dlp and MediaStore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-metrics
          script: |
            set +e
            mkdir -p dama-v2/app/build/reports/androidTests/isolated
            gradle -p dama-v2 installDebug installDebugAndroidTest --stacktrace
            install_status=$?
            if [ "$install_status" -ne 0 ]; then
              adb logcat -d > dama-v2/app/build/reports/androidTests/logcat-install.txt || true
              exit "$install_status"
            fi

            tests=(
              "com.sajang.dama.next.MainActivityTest#invalidInputProducesFailureAndDiagnosticFile"
              "com.sajang.dama.next.MainActivityTest#directMp4IsDownloadedAndSavedToMediaStore"
              "com.sajang.dama.next.MainActivityTest#controlledFixturePageIsExtractedByAndroidYtDlp"
              "com.sajang.dama.next.BrowserCaptureActivityTest#capturesDirectLinkFromLocalJsonFixture"
              "com.sajang.dama.next.BrowserCaptureActivityTest#capturesHlsLinkFromLocalWindowFixture"
            )
            overall=0
            for test_selector in "${tests[@]}"; do
              adb shell pm clear com.sajang.dama.next >/dev/null || true
              adb logcat -c || true
              test_name=$(echo "$test_selector" | tr '#.' '__')
              log_file="dama-v2/app/build/reports/androidTests/isolated/${test_name}.txt"
              timeout 180s adb shell am instrument -w -r \
                -e class "$test_selector" \
                com.sajang.dama.next.test/androidx.test.runner.AndroidJUnitRunner \
                | tee "$log_file"
              command_status=${PIPESTATUS[0]}
              adb logcat -d > "dama-v2/app/build/reports/androidTests/isolated/${test_name}-logcat.txt" || true
              if [ "$command_status" -ne 0 ] || ! grep -q "OK (1 test)" "$log_file"; then
                overall=1
              fi
            done
            exit "$overall"

      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dama-v2-emulator-reports
          if-no-files-found: ignore
          path: |
            dama-v2/app/build/reports/androidTests
            dama-v2/app/build/outputs/androidTest-results
            /tmp/dama-fixture.log
